name: Actualizar dashboard diario (ventas + facturación)

# Actualiza el catálogo (ventas bar + meses nuevos) y la facturación de Alegra
# todos los días, para que el dashboard refleje datos "hasta el presente".
# Requiere los secrets: ALEGRA_EMAIL, ALEGRA_TOKEN
on:
  schedule:
    - cron: '0 23 * * *'   # diario 23:00 UTC = 18:00 COT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests openpyxl

      - name: Actualizar catálogo (ventas bar + meses nuevos)
        run: python3 update_catalogo_maestro.py

      - name: Exportar facturas de Alegra
        id: exportar
        continue-on-error: true
        env:
          ALEGRA_EMAIL: ${{ secrets.ALEGRA_EMAIL }}
          ALEGRA_TOKEN: ${{ secrets.ALEGRA_TOKEN }}
        run: python3 exportar_alegra.py

      - name: Commit y push (si hay cambios)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalogo.json data/facturas_*.json
          if git diff --cached --quiet; then
            echo "Sin cambios en catalogo/facturas."
          else
            git commit -m "Auto: actualización diaria dashboard — $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push
          fi

      - name: Aviso por Telegram (falló exportación de Alegra)
        if: steps.exportar.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Sin credenciales de Telegram; se omite el aviso."
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode="HTML" \
            -d text="⚠️ <b>dashboard-maestro</b>: falló <code>exportar_alegra.py</code>. Revisa el token de Alegra."

      - name: Aviso por Telegram (falló el workflow)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Sin credenciales de Telegram; se omite el aviso."
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode="HTML" \
            -d text="⚠️ <b>dashboard-maestro</b>: falló el workflow de actualización diaria. Revisa la pestaña Actions."
