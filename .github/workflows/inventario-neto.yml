name: Generar inventario neto

# Regenera data/inventario_neto.json leyendo el Google Sheet de inventario y
# las ventas de Alegra. Reemplaza al cron local (nucleo_de_inventario.py),
# para que el dashboard se actualice solo sin depender del PC.

on:
  schedule:
    - cron: '0 */3 * * *'   # cada 3 horas
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: inventario-neto
  cancel-in-progress: false

jobs:
  inventario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests openpyxl

      - name: Generar inventario_neto.json
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ALEGRA_EMAIL: ${{ secrets.ALEGRA_EMAIL }}
          ALEGRA_TOKEN: ${{ secrets.ALEGRA_TOKEN }}
        run: python inventario/nucleo_de_inventario.py

      - name: Commit y push (si cambió)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/inventario_neto.json
          if git diff --cached --quiet; then
            echo "Sin cambios en inventario_neto.json."
          else
            git commit -m "Auto: inventario neto $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push
          fi
